<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub + jsDelivr Media Manager</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; color: #333; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-weight: bold; margin-bottom: 0.25rem; font-size: 0.9rem; }
    input[type="text"] { width: 100%; padding: 0.5rem; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { background: #000; color: #fff; border: none; padding: 0.75rem 1.5rem; cursor: pointer; border-radius: 4px; font-weight: bold; width: 100%; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .result { margin-top: 2rem; padding: 1rem; border: 1px solid #4CAF50; border-radius: 4px; background: #f9fff9; }
    .error { color: #d32f2f; margin-top: 1rem; font-weight: bold; }
    img { max-width: 100%; height: auto; margin-top: 1rem; border-radius: 4px; }
  </style>
</head>
<body>

  <h1>Media Manager</h1>
  
  <div class="form-group">
    <label for="repoOwner">GitHub Username / Organization</label>
    <input type="text" id="repoOwner" placeholder="e.g., octocat">
  </div>

  <div class="form-group">
    <label for="repoName">Repository Name</label>
    <input type="text" id="repoName" placeholder="e.g., media-storage">
  </div>

  <div class="form-group">
    <label for="fileInput">Select File</label>
    <input type="file" id="fileInput" accept="image/*,video/*">
  </div>

  <button id="uploadBtn">Upload to GitHub</button>

  <div id="status" class="error"></div>
  <div id="resultContainer" class="result" style="display: none;">
    <strong>Upload Successful!</strong>
    <p>CDN Link:</p>
    <a id="cdnLink" href="#" target="_blank"></a>
    <div id="previewContainer"></div>
  </div>

  <!-- Load our separated JS file -->
  <script src="script.js"></script>
</body>
</html>
