<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio CDN | Media Manager</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ff7b00'><path d='M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z'/></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    /* Default Dark Theme Variables */
    :root {
      --bg-base: #0a0a0b;
      --bg-surface: #141517;
      --bg-surface-hover: #1e1f22;
      --border: #333538;
      --text-main: #e8e8e8;
      --text-muted: #9a9a9a;
      --text-title: #ffffff;
      --primary: #ff7b00;
      --primary-hover: #e66e00;
      --primary-alpha: rgba(255, 123, 0, 0.12);
      --danger: #ef4444;
      --success: #10b981;
      --shadow-heavy: 0 30px 60px rgba(0,0,0,0.8);
      --shadow-modal: 0 25px 50px rgba(0,0,0,0.5);
      --shadow-toast: 0 10px 30px rgba(0,0,0,0.5);
      --context-menu-bg: rgba(20, 21, 23, 0.95);
    }

    /* Light Theme Override Variables */
    body.light-theme {
      --bg-base: #f4f4f5;
      --bg-surface: #ffffff;
      --bg-surface-hover: #f8fafc;
      --border: #e4e4e7;
      --text-main: #18181b;
      --text-muted: #71717a;
      --text-title: #000000;
      --primary-alpha: rgba(255, 123, 0, 0.08);
      --shadow-heavy: 0 20px 40px rgba(0,0,0,0.08);
      --shadow-modal: 0 15px 35px rgba(0,0,0,0.1);
      --shadow-toast: 0 10px 20px rgba(0,0,0,0.1);
      --context-menu-bg: rgba(255, 255, 255, 0.95);
    }

    body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; background: var(--bg-base); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; transition: background-color 0.3s ease, color 0.3s ease; }

    /* --- Brand & Login --- */
    .brand-title { font-family: 'Cinzel', serif; font-size: 1.5rem; letter-spacing: 1px; color: var(--text-title); }
    
    #loginScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100vw; height: 100vh; background-color: var(--bg-base); background-image: radial-gradient(circle at top, rgba(255, 123, 0, 0.05) 0%, transparent 40%); position: absolute; z-index: 9999; }
    .login-card { background: var(--bg-surface); padding: 3.5rem 3rem; border-radius: 12px; border: 1px solid var(--border); border-top: 3px solid var(--primary); width: 100%; max-width: 400px; box-shadow: var(--shadow-heavy); text-align: center; }
    .login-card h2 { margin: 1rem 0 0.5rem 0; font-family: 'Cinzel', serif; font-size: 2rem; color: var(--text-title); }
    .login-card p { color: var(--text-muted); margin-bottom: 2.5rem; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }

    /* --- Layout --- */
    #appScreen { display: none; width: 100%; height: 100%; }
    .sidebar { width: 280px; background: var(--bg-surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 1.5rem 1rem; box-sizing: border-box; z-index: 10; transition: background-color 0.3s ease, border-color 0.3s ease; }
    .brand { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 2.5rem; padding-left: 0.5rem; }
    
    .nav-btn { background: transparent; border: none; color: var(--text-main); padding: 0.85rem 1rem; border-radius: 8px; font-size: 0.95rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 1rem; transition: 0.2s; width: 100%; text-align: left; margin-bottom: 0.5rem; }
    .nav-btn:hover { background: var(--bg-surface-hover); }
    .nav-btn.active { background: var(--primary-alpha); color: var(--primary); font-weight: 600; border-left: 3px solid var(--primary); border-radius: 0 8px 8px 0; }
    .nav-btn.active svg { fill: var(--primary); }

    .new-btn { background: var(--primary); color: #fff; border: none; padding: 1rem 1.5rem; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 0.75rem; transition: 0.2s; margin-bottom: 2rem; width: 100%; justify-content: center; }
    .new-btn:hover { background: var(--primary-hover); transform: translateY(-1px); }

    .user-profile { margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .user-info { display: flex; align-items: center; gap: 0.5rem; font-weight: 500; font-size: 0.9rem; }
    .logout-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 0.5rem; border-radius: 4px; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
    .logout-btn:hover { color: var(--danger); background: rgba(239, 68, 68, 0.1); }
    
    .theme-btn:hover { color: var(--primary); background: var(--primary-alpha); }

    .main-content { flex: 1; overflow-y: auto; padding: 3rem 4rem; position: relative; }

    /* --- Forms, Passwords & UI Elements --- */
    .form-group { margin-bottom: 1.5rem; text-align: left; position: relative; }
    label { font-weight: 600; display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
    input[type="text"], input[type="password"], select { width: 100%; padding: 0.85rem 1rem; background: var(--bg-base); border: 1px solid var(--border); color: var(--text-main); border-radius: 6px; font-size: 0.95rem; font-family: inherit; transition: 0.2s; box-sizing: border-box; }
    input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-alpha); }
    
    .password-wrapper { position: relative; display: flex; align-items: center; }
    .eye-toggle { position: absolute; right: 12px; background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .eye-toggle:hover { color: var(--text-main); }

    .file-drop-area { border: 2px dashed var(--border); border-radius: 8px; padding: 3rem 2rem; text-align: center; background: var(--bg-surface); cursor: pointer; transition: 0.2s; position: relative; }
    .file-drop-area:hover { border-color: var(--primary); background: var(--primary-alpha); }
    .file-drop-area input[type="file"] { position: absolute; left: 0; top: 0; height: 100%; width: 100%; opacity: 0; cursor: pointer; }
    
    button.primary { background: var(--primary); color: #fff; border: none; padding: 0.85rem 1.5rem; cursor: pointer; border-radius: 6px; font-weight: 600; font-size: 0.95rem; transition: 0.2s; width: max-content; }
    button.primary:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }
    button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text-main); padding: 0.6rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500; display: inline-flex; align-items: center; gap: 0.5rem; transition: 0.2s; }
    button.secondary:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-alpha); }
    
    .icon-btn { background: transparent; border: 1px solid transparent; color: var(--text-muted); cursor: pointer; padding: 0.4rem; border-radius: 4px; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; }
    .icon-btn:hover { color: var(--primary); background: var(--primary-alpha); }
    .icon-btn.active-view { color: var(--primary); background: var(--primary-alpha); border-color: var(--primary); }

    .view-section { display: none; max-width: 1100px; margin: 0 auto; }
    .view-section.active { display: block; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    
    /* --- Loader & Toasts --- */
    .loader-container { padding: 3rem; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1rem; color: var(--text-muted); }
    .spinner { border: 3px solid rgba(255, 123, 0, 0.15); border-top: 3px solid var(--primary); border-radius: 50%; width: 32px; height: 32px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .toast-container { position: fixed; bottom: 2rem; right: 2rem; z-index: 10001; display: flex; flex-direction: column; gap: 0.75rem; pointer-events: none; }
    .toast { background: var(--bg-surface); border: 1px solid var(--border); border-left: 4px solid var(--primary); padding: 1rem 1.5rem; border-radius: 8px; box-shadow: var(--shadow-toast); color: var(--text-main); font-size: 0.9rem; font-weight: 500; display: flex; align-items: center; gap: 0.75rem; animation: slideInRight 0.3s forwards; pointer-events: auto; min-width: 280px; max-width: 400px; }
    .toast.success { border-left-color: var(--success); }
    .toast.danger { border-left-color: var(--danger); }
    .toast .spinner { width: 16px; height: 16px; border-width: 2px; }
    @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes fadeOut { to { opacity: 0; } }

    /* --- Toolbar & Search --- */
    .section-header { font-size: 1.75rem; font-family: 'Cinzel', serif; color: var(--text-title); margin: 0; }
    .header-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
    .search-container { display: flex; align-items: center; position: relative; flex: 1; max-width: 350px; margin-left: 2rem; }
    .search-container:focus-within .search-icon { fill: var(--primary); }
    input[type="text"].search-input { width: 100%; padding: 0.65rem 1rem 0.65rem 2.75rem; background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-main); border-radius: 24px; font-size: 0.9rem; transition: all 0.2s ease; }
    input[type="text"].search-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-alpha); background: var(--bg-base); }
    .search-icon { position: absolute; left: 14px; fill: var(--text-muted); width: 18px; height: 18px; pointer-events: none; transition: fill 0.2s ease; }

    .toolbar-actions { display: flex; gap: 0.75rem; align-items: center; margin-left: auto; }
    .view-toggles { display: flex; gap: 0.25rem; background: var(--bg-surface); padding: 0.25rem; border-radius: 6px; border: 1px solid var(--border); }

    /* --- Explorer Layout --- */
    .breadcrumbs { display: flex; align-items: center; gap: 0.5rem; padding: 1rem 1.5rem; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; font-weight: 500; }
    .crumb { color: var(--text-muted); cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 0.5rem; }
    .crumb:hover { color: var(--primary); }
    .crumb.active { color: var(--text-main); cursor: default; }
    .crumb-separator { color: var(--border); }

    .folder-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .folder-card { display: flex; align-items: center; gap: 0.75rem; padding: 1rem 1.25rem; background: var(--bg-surface); border-radius: 8px; cursor: context-menu; border: 1px solid var(--border); transition: 0.2s; font-weight: 500; font-size: 0.95rem; }
    .folder-card svg { fill: var(--primary); }
    .folder-card:hover { background: var(--bg-surface-hover); border-color: var(--primary); transform: translateY(-1px); }

    .table-container { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; text-align: left; font-size: 0.9rem; }
    th { color: var(--text-muted); font-weight: 600; padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px; background: var(--bg-base); }
    td { padding: 0.85rem 1.25rem; border-bottom: 1px solid var(--border); color: var(--text-main); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr { transition: 0.2s; cursor: context-menu; }
    tr:hover td { background: var(--bg-surface-hover); }
    .file-name-wrapper { display: flex; align-items: center; gap: 0.75rem; }
    .file-name-wrapper svg { fill: var(--text-muted); flex-shrink: 0; }
    .truncate-url { max-width: 250px; display: inline-block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; color: var(--text-muted); margin-right: auto; }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .grid-view-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.25rem; }
    .grid-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; transition: 0.2s; cursor: context-menu; }
    .grid-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 8px 16px rgba(0,0,0,0.15); }
    .grid-preview { height: 140px; background: var(--bg-base); display: flex; align-items: center; justify-content: center; overflow: hidden; border-bottom: 1px solid var(--border); }
    .grid-preview img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .grid-preview svg { width: 48px; height: 48px; fill: var(--text-muted); opacity: 0.5; }
    .grid-info { padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .grid-title { font-weight: 500; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
    .grid-meta { font-size: 0.75rem; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }

    /* --- Right-Click Context Menu --- */
    .context-menu { display: none; position: fixed; z-index: 10000; width: 220px; background: var(--context-menu-bg); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow-toast); padding: 0.5rem; flex-direction: column; }
    .context-menu-item { padding: 0.65rem 1rem; color: var(--text-main); cursor: pointer; border-radius: 4px; display: flex; align-items: center; gap: 0.75rem; font-size: 0.85rem; font-weight: 500; transition: 0.2s; }
    .context-menu-item svg { fill: currentColor; }
    .context-menu-item:hover { background: var(--bg-surface-hover); color: var(--primary); }
    .context-menu-item.danger:hover { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
    .context-divider { height: 1px; background: var(--border); margin: 0.5rem 0; }

    /* --- Modals --- */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 10000; justify-content: center; align-items: center; opacity: 0; animation: fadeIn 0.2s forwards; }
    .modal-content { background: var(--bg-surface); padding: 2rem; border-radius: 12px; max-width: 90vw; max-height: 90vh; position: relative; border: 1px solid var(--border); display: flex; flex-direction: column; box-shadow: var(--shadow-modal); }
    .modal-close { position: absolute; top: 1rem; right: 1rem; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.2rem; transition: 0.2s; }
    .modal-close:hover { color: var(--danger); }
    
    .action-box { width: 400px; text-align: left; }
    .action-box h3 { margin-top: 0; margin-bottom: 1.5rem; color: var(--text-title); font-family: 'Cinzel', serif; font-size: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; }
    
    .preview-media { max-width: 100%; max-height: 75vh; object-fit: contain; border-radius: 4px; }
    .status-text { margin-top: 1rem; font-weight: 500; color: var(--primary); }
    .error-text { color: var(--danger); margin-top: 1rem; font-size: 0.9rem; }
  </style>
</head>
<body>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Login Modal -->
  <div id="loginScreen">
    <div class="login-card">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="var(--primary)"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
      <h2>Studio CDN</h2>
      <p>Asset Management Portal</p>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Operator Profile</label>
          <select id="loginUser" required>
            <option value="" disabled selected>Select Profile</option>
            <option value="Shivam">Shivam</option>
            <option value="Aninda">Aninda</option>
            <option value="Sharvan">Sharvan</option>
          </select>
        </div>
        <div class="form-group">
          <label>Security Token</label>
          <div class="password-wrapper">
            <input type="password" id="loginPassword" placeholder="Enter your password" required>
            <button type="button" class="eye-toggle" onclick="togglePassword()" title="Toggle visibility">
              <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="primary" id="loginBtn" style="width: 100%;">Authorize Access</button>
        <div id="loginError" class="error-text"></div>
      </form>
    </div>
  </div>

  <!-- Main Drive UI -->
  <div id="appScreen">
    <aside class="sidebar">
      <div class="brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="var(--primary)"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
        <span class="brand-title">STUDIO CDN</span>
      </div>
      
      <button class="new-btn" onclick="switchTab('upload')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        New Deployment
      </button>

      <nav>
        <button class="nav-btn active" id="nav-upload" onclick="switchTab('upload')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
          Upload Center
        </button>
        <button class="nav-btn" id="nav-history" onclick="switchTab('history')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>
          Asset Library
        </button>
      </nav>

      <div class="user-profile">
        <div class="user-info">
          <div style="width: 24px; height: 24px; background: var(--primary); border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;" id="userAvatar"></div>
          <span id="userNameDisplay"></span>
        </div>
        <div style="display: flex; gap: 0.25rem;">
          <!-- Theme Switcher -->
          <button class="logout-btn theme-btn" onclick="toggleTheme()" title="Switch Theme" id="themeToggleBtn">
            <!-- Default Moon Icon (Swapped dynamically in JS) -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
          </button>
          <!-- Logout Button -->
          <button class="logout-btn" onclick="logout()" title="Logout">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <main class="main-content">
      
      <!-- UPLOAD TAB -->
      <div id="uploadTab" class="view-section active">
        <h2 class="section-header" style="margin-bottom: 2rem;">Deploy Assets</h2>
        <div style="max-width: 600px;">
          <div class="form-group">
            <label>Destination Path</label>
            <select id="folderSelect" onchange="toggleNewFolderInput()"></select>
            <input type="text" id="newFolderInput" placeholder="Enter new folder or nested path (e.g. Promos/2026)" style="display: none; margin-top: 0.75rem;">
          </div>

          <div class="form-group">
            <label>Format Optimization</label>
            <select id="formatSelect">
              <option value="original">Keep Original Format</option>
              <option value="webp">Force WEBP Conversion (Images)</option>
              <option value="png">Force PNG Conversion (Images)</option>
            </select>
          </div>

          <div class="form-group">
            <label>Select Assets</label>
            <div class="file-drop-area">
              <svg width="36" height="36" viewBox="0 0 24 24" fill="var(--primary)" style="margin-bottom: 1rem;"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
              <div style="font-weight: 500; color: var(--text-main);">Drop files to deploy</div>
              <span class="file-msg" id="fileMsg">or click to browse local storage</span>
              <input type="file" id="fileInput" accept="image/*,video/*" multiple onchange="updateFileMsg()">
            </div>
          </div>

          <button id="uploadBtn" class="primary">Push to CDN</button>
          <div id="status" class="status-text"></div>
        </div>
      </div>

      <!-- EXPLORER TAB -->
      <div id="historyTab" class="view-section" style="max-width: 100%;">
        
        <div class="header-toolbar">
          <h2 class="section-header">Asset Explorer</h2>
          <div class="search-container" id="searchContainer" style="display: none;">
            <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="searchInput" class="search-input" placeholder="Search files & folders..." onkeyup="renderFiles()">
          </div>

          <div class="toolbar-actions" id="toolbarActions" style="display: none;">
            <div class="view-toggles">
              <button class="icon-btn active-view" id="btn-view-list" onclick="changeViewMode('list')" title="List View">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
              </button>
              <button class="icon-btn" id="btn-view-grid" onclick="changeViewMode('grid')" title="Grid View">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M4 11h5V5H4v6zm0 7h5v-6H4v6zm7 0h5v-6h-5v6zm7 0h5v-6h-5v6zm-7-13v6h5V5h-5zm7 0v6h5V5h-5z"/></svg>
              </button>
            </div>
            <button id="historyCsvBtn" class="secondary">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
              Export
            </button>
          </div>
        </div>
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; gap: 1rem;">
          <div class="breadcrumbs" id="breadcrumbNav" style="margin-bottom: 0; flex: 1;"></div>
          <div id="itemCountBadge" style="background: var(--bg-surface); border: 1px solid var(--border); padding: 0.85rem 1.25rem; border-radius: 8px; color: var(--text-muted); font-size: 0.85rem; font-weight: 500; display: none; white-space: nowrap; box-shadow: 0 4px 6px rgba(0,0,0,0.1);"></div>
        </div>

        <div id="historyFolderGrid" class="folder-grid"></div>
        <div id="historyFilesSection"></div>
        <div style="margin-top: 1.5rem; text-align: center; color: var(--text-muted); font-size: 0.85rem;" id="contextHint">Right-click any folder or file for advanced actions.</div>
      </div>
    </main>
  </div>

  <!-- Right-Click Context Menu -->
  <div id="contextMenu" class="context-menu">
    <div class="context-menu-item" id="menu-preview" onclick="triggerContextAction('preview')">
      <svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
      Preview Media
    </div>
    <div class="context-menu-item" id="menu-copy" onclick="triggerContextAction('copy')">
      <svg width="16" height="16" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
      Copy CDN URL
    </div>
    <div class="context-divider" id="menu-divider-1"></div>
    
    <div class="context-menu-item" onclick="triggerContextAction('rename')">
      <svg width="16" height="16" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.69l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
      Rename
    </div>
    <div class="context-menu-item" onclick="triggerContextAction('move')">
      <svg width="16" height="16" viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-1 8h-3v3h-2v-3h-3v-2h3V9h2v3h3v2z"/></svg>
      Move to...
    </div>
    <div class="context-menu-item" onclick="triggerContextAction('duplicate')">
      <svg width="16" height="16" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm-1 12H6V5h9v8zM19 19H8v-2h11V6h2v11c0 1.1-.9 2-2 2z"/></svg>
      Duplicate to...
    </div>

    <div class="context-divider"></div>
    <div class="context-menu-item danger" onclick="triggerContextAction('delete')">
      <svg width="16" height="16" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
      Delete
    </div>
  </div>

  <!-- Preview Modal -->
  <div class="modal-overlay" id="previewModal" onclick="closeModal('previewModal')">
    <div class="modal-content" onclick="event.stopPropagation()" style="align-items: center; padding: 1rem;">
      <button class="modal-close" onclick="closeModal('previewModal')">✕</button>
      <div id="mediaContainer"></div>
      <div id="previewFileName" style="margin-top: 1rem; color: var(--text-muted); font-size: 0.9rem; font-family: monospace;"></div>
    </div>
  </div>

  <!-- Action Modal (Rename/Move/Duplicate) -->
  <div class="modal-overlay" id="actionModal" onclick="closeModal('actionModal')">
    <div class="modal-content action-box" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal('actionModal')">✕</button>
      <h3 id="actionModalTitle">Manage Asset</h3>
      
      <div class="form-group" id="actionFolderGroup" style="display: none;">
        <label>Select Destination Directory</label>
        <select id="actionFolderSelect" onchange="handleActionSelectChange()">
          <option value="">/ (Root Directory)</option>
        </select>
      </div>

      <div class="form-group" id="actionInputGroup">
        <label id="actionLabel">New Name or Path</label>
        <input type="text" id="actionInput">
      </div>

      <div id="actionError" class="error-text"></div>
      <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 0.5rem;">
        <button class="secondary" onclick="closeModal('actionModal')">Cancel</button>
        <button class="primary" id="executeActionBtn" onclick="executeAction()">Confirm</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
