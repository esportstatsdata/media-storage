<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDN Media Manager</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; color: #333; }
    .upload-box { background: #f5f5f5; padding: 2rem; border-radius: 8px; text-align: center; margin-bottom: 2rem; }
    .form-group { margin-bottom: 1rem; text-align: left; }
    label { font-weight: bold; display: block; margin-bottom: 0.5rem; }
    select, input[type="file"] { width: 100%; padding: 0.5rem; margin-bottom: 1rem; }
    button { background: #000; color: #fff; border: none; padding: 0.75rem 1.5rem; cursor: pointer; border-radius: 4px; font-weight: bold; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #csvBtn { background: #4CAF50; margin-top: 1rem; display: none; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; text-align: left; }
    th, td { border: 1px solid #ddd; padding: 0.75rem; word-break: break-all; }
    th { background-color: #f2f2f2; }
    .status-text { margin-top: 1rem; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Media Manager</h1>
  
  <div class="upload-box">
    <div class="form-group">
      <label for="fileInput">Select Files</label>
      <input type="file" id="fileInput" accept="image/*,video/*" multiple>
    </div>

    <div class="form-group">
      <label for="formatSelect">Image Conversion</label>
      <select id="formatSelect">
        <option value="original">Keep Original Format</option>
        <option value="webp">Convert to WEBP</option>
        <option value="png">Convert to PNG</option>
      </select>
    </div>

    <button id="uploadBtn">Upload Files</button>
    <div id="status" class="status-text"></div>
  </div>

  <div id="resultsContainer" style="display: none;">
    <h2>Generated Links</h2>
    <table id="linksTable">
      <thead>
        <tr>
          <th style="width: 30%;">File Name</th>
          <th>CDN Link</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    
    <button id="csvBtn">Download CSV</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
