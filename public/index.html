<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Media Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Drive Dark Theme Palette */
      --bg-base: #131314;
      --bg-surface: #1e1f20;
      --bg-surface-hover: #2b2d2f;
      --border: #444746;
      --text-main: #e3e3e3;
      --text-muted: #c4c7c5;
      --primary: #ff7b00;
      --primary-hover: #e66e00;
      --primary-alpha: rgba(255, 123, 0, 0.15);
      --danger: #ea4335;
    }

    body { 
      font-family: 'Inter', sans-serif; 
      margin: 0; 
      padding: 0; 
      background: var(--bg-base); 
      color: var(--text-main); 
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* --- Login Screen --- */
    #loginScreen { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      width: 100vw; 
      height: 100vh; 
      background: var(--bg-base); 
    }
    .login-card { 
      background: var(--bg-surface); 
      padding: 3rem; 
      border-radius: 16px; 
      border: 1px solid var(--border); 
      width: 100%; 
      max-width: 400px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .login-card h2 { margin: 0 0 0.5rem 0; font-size: 1.75rem; color: var(--text-main); text-align: center; }
    .login-card p { color: var(--text-muted); text-align: center; margin-bottom: 2rem; font-size: 0.95rem; }

    /* --- Application Layout --- */
    #appScreen { 
      display: none; 
      width: 100%; 
      height: 100%; 
    }
    
    .sidebar {
      width: 260px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1rem;
      box-sizing: border-box;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 2rem;
      padding-left: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      padding: 0.75rem 1rem;
      border-radius: 24px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: 0.2s ease;
      width: 100%;
      text-align: left;
      margin-bottom: 0.5rem;
    }
    
    .nav-btn:hover { background: var(--bg-surface-hover); }
    .nav-btn.active { background: var(--primary-alpha); color: var(--primary); }
    .nav-btn.active svg { fill: var(--primary); }

    .new-btn {
      background: var(--bg-surface-hover);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 1rem 1.5rem;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      transition: 0.2s;
      margin-bottom: 2rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .new-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
    .new-btn:hover svg { fill: #fff; }

    .user-profile {
      margin-top: auto;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .user-info { display: flex; align-items: center; gap: 0.5rem; font-weight: 500; font-size: 0.9rem; }
    .logout-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.85rem; padding: 0.5rem; border-radius: 4px; }
    .logout-btn:hover { color: var(--danger); background: rgba(234, 67, 53, 0.1); }

    .main-content {
      flex: 1;
      background: var(--bg-base);
      overflow-y: auto;
      padding: 2rem 3rem;
    }

    /* --- Forms & Inputs --- */
    .form-group { margin-bottom: 1.75rem; }
    label { font-weight: 500; display: block; margin-bottom: 0.75rem; color: var(--text-main); font-size: 0.95rem; }
    
    select, input[type="text"], input[type="password"] { 
      width: 100%; padding: 0.85rem 1rem; background: var(--bg-base); border: 1px solid var(--border); 
      color: var(--text-main); border-radius: 8px; font-size: 0.95rem; font-family: inherit; transition: 0.2s;
    }
    .login-card select, .login-card input { background: var(--bg-surface-hover); }
    select:focus, input:focus { outline: none; border-color: var(--primary); }
    
    /* Upload Dropzone Styling */
    .file-drop-area {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 3rem 2rem;
      text-align: center;
      background: var(--bg-surface);
      cursor: pointer;
      transition: 0.2s;
      position: relative;
    }
    .file-drop-area:hover { border-color: var(--primary); background: var(--primary-alpha); }
    .file-drop-area input[type="file"] {
      position: absolute; left: 0; top: 0; height: 100%; width: 100%; opacity: 0; cursor: pointer;
    }
    .file-msg { color: var(--text-muted); font-size: 0.95rem; display: block; margin-top: 1rem; }
    
    button.primary { 
      background: var(--primary); color: #fff; border: none; padding: 0.85rem 1.5rem; 
      cursor: pointer; border-radius: 24px; font-weight: 600; font-size: 0.95rem; transition: 0.2s; width: max-content;
    }
    .login-card button.primary { width: 100%; border-radius: 8px; margin-top: 1rem; }
    button.primary:hover { background: var(--primary-hover); }
    button.primary:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }
    
    button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text-main); padding: 0.6rem 1.25rem; border-radius: 24px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; font-weight: 500; }
    button.secondary:hover { border-color: var(--primary); color: var(--primary); }

    /* --- Views --- */
    .view-section { display: none; max-width: 1200px; }
    .view-section.active { display: block; }
    .section-header { font-size: 1.5rem; font-weight: 400; margin-bottom: 2rem; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; }

    /* --- Folders --- */
    .folder-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 3rem; }
    .folder-card { 
      display: flex; align-items: center; gap: 1rem; padding: 1rem 1.25rem; 
      background: var(--bg-surface); border-radius: 12px; cursor: pointer; border: 1px solid var(--border); 
      transition: 0.2s; color: var(--text-main); font-weight: 500; font-size: 0.95rem;
    }
    .folder-card svg { fill: var(--text-muted); }
    .folder-card:hover { background: var(--bg-surface-hover); }
    .folder-card.selected { background: var(--primary-alpha); border-color: var(--primary); }
    .folder-card.selected svg { fill: var(--primary); }

    /* --- Tables --- */
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th { color: var(--text-muted); font-weight: 500; padding: 1rem; border-bottom: 1px solid var(--border); }
    td { padding: 1rem; border-bottom: 1px solid var(--border); color: var(--text-main); word-break: break-all; }
    tr:hover td { background: var(--bg-surface); }
    
    .file-name-cell { display: flex; align-items: center; gap: 0.75rem; }
    .file-name-cell svg { fill: var(--text-muted); flex-shrink: 0; }
    
    a { color: #8ab4f8; text-decoration: none; }
    a:hover { text-decoration: underline; }
    
    .status-text { margin-top: 1.5rem; font-weight: 500; color: var(--primary); }
    .error-text { color: var(--danger); margin-top: 1rem; font-size: 0.9rem; text-align: center; }
  </style>
</head>
<body>

  <!-- Login Modal -->
  <div id="loginScreen">
    <div class="login-card">
      <h2>Media Manager</h2>
      <p>Secure Workspace Authentication</p>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <select id="loginUser" required>
            <option value="" disabled selected>Select User Profile</option>
            <option value="Shivam">Shivam</option>
            <option value="Aninda">Aninda</option>
          </select>
        </div>
        <div class="form-group">
          <input type="password" id="loginPassword" placeholder="Enter Password" required>
        </div>
        <button type="submit" class="primary" id="loginBtn">Sign In</button>
        <div id="loginError" class="error-text"></div>
      </form>
    </div>
  </div>

  <!-- Main Drive UI -->
  <div id="appScreen">
    
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="var(--primary)"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
        Cloud CDN
      </div>
      
      <button class="new-btn" onclick="switchTab('upload')">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        New Upload
      </button>

      <nav>
        <button class="nav-btn active" id="nav-upload" onclick="switchTab('upload')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
          Upload Center
        </button>
        <button class="nav-btn" id="nav-history" onclick="switchTab('history')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>
          My Drive
        </button>
      </nav>

      <div class="user-profile">
        <div class="user-info">
          <div style="width: 24px; height: 24px; background: var(--primary); border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px;" id="userAvatar">S</div>
          <span id="userNameDisplay"></span>
        </div>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      
      <!-- UPLOAD TAB -->
      <div id="uploadTab" class="view-section active">
        <h2 class="section-header">Upload Assets</h2>
        
        <div style="max-width: 600px;">
          <div class="form-group">
            <label>Destination Folder</label>
            <select id="folderSelect" onchange="toggleNewFolderInput()">
              <option value="">-- Loading your folders --</option>
            </select>
            <input type="text" id="newFolderInput" placeholder="New folder name (e.g. Campaign-2026)" style="display: none; margin-top: 0.5rem;">
          </div>

          <div class="form-group">
            <label>Format Optimization</label>
            <select id="formatSelect">
              <option value="original">Keep Original Format</option>
              <option value="webp">Convert to WEBP (Images only)</option>
              <option value="png">Convert to PNG (Images only)</option>
            </select>
          </div>

          <div class="form-group">
            <label>Select Files</label>
            <div class="file-drop-area">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="var(--primary)" style="margin-bottom: 1rem;"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
              <div style="font-weight: 500; font-size: 1.1rem;">Drag & drop files here</div>
              <span class="file-msg" id="fileMsg">or click to browse from your computer</span>
              <input type="file" id="fileInput" accept="image/*,video/*" multiple onchange="updateFileMsg()">
            </div>
          </div>

          <button id="uploadBtn" class="primary">Deploy to CDN</button>
          <div id="status" class="status-text"></div>
        </div>
      </div>

      <!-- HISTORY TAB -->
      <div id="historyTab" class="view-section">
        <h2 class="section-header">My Drive</h2>
        
        <label>Folders</label>
        <div id="historyFolderGrid" class="folder-grid">
          <!-- Folders injected here via JS -->
        </div>
        
        <div id="historyFilesSection" style="display: none;">
          <div class="section-header" style="font-size: 1.25rem; margin-top: 1rem; border-top: 1px solid var(--border); padding-top: 2rem;">
            <span>Files in <strong id="currentHistoryFolder" style="color: var(--primary);"></strong></span>
            <button id="historyCsvBtn" class="secondary" style="display: none;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: middle; margin-right: 0.5rem;"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
              Export CSV
            </button>
          </div>
          
          <table>
            <thead>
              <tr>
                <th style="width: 35%;">Name</th>
                <th style="width: 30%;">System ID</th>
                <th>CDN URL</th>
              </tr>
            </thead>
            <tbody id="historyTableBody"></tbody>
          </table>
        </div>
      </div>
      
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
